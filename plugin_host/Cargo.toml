[package]
name = "yedmq-plugin-host"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0.114", features = ["derive", "rc"] }
anyhow = "1.0"
toml = "0.8.6"
tokio = { version = "1.29.1", features = ["full"] }
tokio-util = { version = "0.7.16", features = ["codec", "compat"] }
prost = "0.13.4"
bytes = "1"
prost-types = "0.13.4"
uuid = { version = "1.18.1", features = ["v4"] }
chrono = "0.4.42"
interprocess = { version = "2.2.3", features = ["tokio", "async"] }
futures = "0.3.31"
log = "0.4"
env_logger = "0.10.1"
rand = "0.9.2"
thiserror = "1.0"
dashmap = "=6.1.0"

[build-dependencies]
prost-build = "0.13.4"
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile = "3.21.0"
serde_json = "1.0.57"
tokio = { version = "1.29.1", features = ["full"] }
