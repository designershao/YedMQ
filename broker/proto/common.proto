syntax = "proto3";

package yedmqpb;

// Application-specific error codes carried in gRPC status details.
// tonic::Status::code should describe the broad transport/API class,
// while ErrorCode provides the broker-specific subtype.
enum ErrorCode {
  // Common / cross-domain errors: 0-999
  UNKNOWN = 0;
  INTERNAL_ERROR = 1;
  INVALID_ARGUMENT = 2;
  NOT_FOUND = 3;
  NOT_LEADER = 4;
  NO_LEADER_AVAILABLE = 5;
  NOT_INITIALIZED = 6;
  NOT_READY = 7;
  SERVICE_UNAVAILABLE = 8;
  SERIALIZATION_ERROR = 9;
  UNEXPECTED_RESPONSE_TYPE = 10;

  // Session-related errors: 1000-1999
  SESSION_TENANT_NOT_FOUND = 1000;
  SESSION_NOT_FOUND = 1001;
  SESSION_NODE_NOT_FOUND = 1002;
  SESSION_VERSION_REJECTED = 1003;
  SESSION_TENANT_ALREADY_EXISTS = 1004;
  SESSION_ALREADY_EXISTS = 1005;
  NEWER_SESSION_EXISTS = 1006;

  // Topic-related errors: 2000-2999
  TOPIC_INVALID_NAME = 2000;
  TOPIC_INVALID_FILTER = 2001;
  TOPIC_TENANT_NOT_FOUND = 2002;
  TOPIC_NOT_FOUND = 2003;

  // Session-state-related errors: 3000-3999
  SESSION_STATE_NOT_FOUND = 3000;
  PACKET_IDENTIFIER_ALREADY_EXISTS = 3001;
  PAYLOAD_NOT_FOUND = 3002;
  PAYLOAD_MISSING = 3003;
}

message ErrorDetail {

  ErrorCode code = 1;

  string message = 2;

  string node = 3;

}
