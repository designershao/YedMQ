syntax = "proto3";

import "common.proto";

package yedmqpb;

// ClusterService defines all RPCs for cluster management and MQTT broker operations.
service ClusterService {

    // Store an offline message for a persistent client which is not currently connected.
    rpc StoreOfflineMessage(StoreOfflineMessageRequest) returns (StoreOfflineMessageResponse);

    // Pop (retrieve and remove) an offline message for a persistent client which is not currently connected.
    rpc PopOfflineMessage(PopOfflineMessageRequest) returns (PopOfflineMessageResponse);

    // Get the session state for a client.
    rpc GetSessionState(GetSessionStateRequest) returns (GetSessionStateResponse);

    // Create a new session state for a client.
    rpc CreateSessionState(CreateSessionStateRequest) returns (CreateSessionStateResponse);

    // Delete the session state for a client.
    rpc DeleteSessionState(DeleteSessionStateRequest) returns (DeleteSessionStateResponse);

    // Register a received inflight packet for a client.
    rpc RegisterInflightRxPacket(RegisterInflightRxPacketRequest) returns (RegisterInflightRxPacketResponse);

    // Register a transmitted inflight packet for a client.
    rpc RegisterInflightTxPacket(RegisterInflightTxPacketRequest) returns (RegisterInflightTxPacketResponse);

    // Advance the state of an inflight packet.
    rpc AdvanceInflightState(AdvanceInflightStateRequest) returns (AdvanceInflightStateResponse);

    // Get the current inflight packet for a client.
    rpc GetCurrentInflightPacket(GetCurrentInflightPacketRequest) returns (GetCurrentInflightPacketResponse);

    // Get the next inflight packet for a client.
    rpc GetNextInflightPacket(GetNextInflightPacketRequest) returns (GetNextInflightPacketResponse);

    // Subscribe a client to a topic.
    rpc SubscribeTopic(SubscribeTopicRequest) returns (SubscribeTopicResponse);

    // Unsubscribe a client from a topic.
    rpc UnsubscribeTopic(UnsubscribeTopicRequest) returns (UnsubscribeTopicResponse);

    // Get all subscribers for a specific topic.
    rpc GetSubscribersByTopic(GetSubscribersByTopicRequest) returns (GetSubscribersByTopicResponse);

    // Register a retained publish message for a topic.
    rpc RegisterRetainPublishMessage(RegisterRetainPublishMessageRequest) returns (RegisterRetainPublishMessageResponse);
    
    // Get the retained publish message for a topic.
    rpc GetRetainPublishMessage(GetRetainPublishMessageRequest) returns (GetRetainPublishMessageResponse);
    
    // Clean (remove) the retained publish message for a topic.
    rpc CleanRetainPublishMessage(CleanRetainPublishMessageRequest) returns (CleanRetainPublishMessageResponse);
    
    // Register a session actor mapping for a client.
    rpc RegisterSessionActorMap(RegisterSessionActorMapRequest) returns (RegisterSessionActorMapResponse);

    // Unregister a session actor mapping for a client.
    rpc UnRegisterSessionActorMap(UnregisterSessionActorMapRequest) returns (UnregisterSessionActorMapResponse);

    // Renew the session lease for a client.
    rpc RenewSessionLease(RenewSessionLeaseRequest) returns (RenewSessionLeaseResponse);

    // Get session actor map
    rpc GetSessionActorMap(GetSessionActorMapRequest) returns (GetSessionActorMapResponse);

    // Route a packet to the appropriate node or client.
    rpc RoutePacket(RoutePacketRequest) returns (RoutePacketResponse);

    // Force stop session actor
    rpc ForceStopSessionActor(ForceStopSessionActorRequest) returns (ForceStopSessionActorResponse);

    // Get session info
    rpc GetSessionInfo(GetSessionInfoRequest) returns (GetSessionInfoResponse);

}

// Request to store an offline message for a client.
message StoreOfflineMessageRequest {
    string tenant_id = 1; // Tenant identifier
    string client_id = 2; // Client identifier
    string packet_key = 3;   // Message packet key
}

// Response for storing an offline message.
message StoreOfflineMessageResponse {}

// Request to pop an offline message for a client.
message PopOfflineMessageRequest {
    string tenant_id = 1;
    string client_id = 2;
}

// Response for popping an offline message.
message PopOfflineMessageResponse {
    optional string packet_key = 1; // The popped message key
    optional bytes packet_data = 2; // The popped message payload data
}

// Request to get the session state for a client.
message GetSessionStateRequest {
    string tenant_id = 1;
    string client_id = 2;
}

// Response for getting the session state.
message GetSessionStateResponse {
    optional string payload = 1; // Session state data
    optional uint64 disconnected_at = 2; // Timestamp when the session was disconnected
}

// Request to create a session state for a client.
message CreateSessionStateRequest {
    string tenant_id = 1;
    string client_id = 2;
    string payload = 3; // Session state data
    optional uint64 disconnected_at = 4; // Timestamp when the session was disconnected
}

// Response for creating a session state.
message CreateSessionStateResponse {}

// Request to delete a session state for a client.
message DeleteSessionStateRequest {
    string tenant_id = 1;
    string client_id = 2;
}

// Response for deleting a session state.
message DeleteSessionStateResponse {}

// Request to register a received inflight packet.
message RegisterInflightRxPacketRequest {
    string tenant_id = 1;
    string client_id = 2;
    uint32 packet_id = 3;
    uint32 qos = 4;
    string packet_key = 5;
}

// Response for registering a received inflight packet.
message RegisterInflightRxPacketResponse {}

// Request to register a transmitted inflight packet.
message RegisterInflightTxPacketRequest {
    string tenant_id = 1;
    string client_id = 2;
    uint32 packet_id = 3;
    uint32 qos = 4;
    string packet_key = 5;
}

// Response for registering a transmitted inflight packet.
message RegisterInflightTxPacketResponse {}

// Request to advance the state of an inflight packet.
message AdvanceInflightStateRequest {
    string tenant_id = 1;
    string client_id = 2;
    uint32 packet_id = 3; // MQTT packet identifier is 16-bit
}

// Response for advancing the inflight packet state.
message AdvanceInflightStateResponse {}

// Request to get the current inflight packet.
message GetCurrentInflightPacketRequest {
    string tenant_id = 1;
    string client_id = 2;
    uint32 packet_id = 3; // MQTT packet identifier is 16-bit
}

// Response for getting the current inflight packet.
message GetCurrentInflightPacketResponse {
    optional string packet = 1; // Packet data
}

// Request to get the next inflight packet.
message GetNextInflightPacketRequest {
    string tenant_id = 1;
    string client_id = 2;
    uint32 packet_id = 3; // MQTT packet identifier is 16-bit
}

// Response for getting the next inflight packet.
message GetNextInflightPacketResponse {
    optional string packet = 1; // Packet data
}

// Request to subscribe a client to a topic.
message SubscribeTopicRequest {
    uint64 node_id = 1;    // Node identifier
    string tenant_id = 2;
    string client_id = 3;
    string topic = 4;      // Topic name
    uint32 qos = 5;        // Quality of Service level
    bool no_local = 6;
    bool retain_as_published = 7;
}

// Response for subscribing to a topic.
message SubscribeTopicResponse {}

// Request to unsubscribe a client from a topic.
message UnsubscribeTopicRequest {
    string tenant_id = 2;
    string client_id = 3;
    string topic = 4;
}

// Response for unsubscribing from a topic.
message UnsubscribeTopicResponse {}

// Request to get all subscribers for a topic.
message GetSubscribersByTopicRequest {
    string tenant_id = 1;
    string topic = 2;
}

// Subscriber information.
message Subscriber {
    uint32 qos = 2;
    string client_id = 3;
    bool no_local = 4;
    bool retain_as_published = 5;
}

// Response for getting subscribers by topic.
message GetSubscribersByTopicResponse {
    repeated Subscriber payload = 1; // List of subscribers
}

// Request to register a retained publish message.
message RegisterRetainPublishMessageRequest {
    string tenant_id = 1;
    string client_id = 2;
    string payload = 3; // Message payload
}

// Response for registering a retained publish message.
message RegisterRetainPublishMessageResponse {}

// Request to get a retained publish message.
message GetRetainPublishMessageRequest {
    string tenant_id = 1;
    string topic = 2;
}

// Response for getting a retained publish message.
message GetRetainPublishMessageResponse {
    optional string payload = 1; // The retained message payload
}

// Request to clean a retained publish message.
message CleanRetainPublishMessageRequest {
    string tenant_id = 1;
    string topic = 2;
}

// Response for cleaning a retained publish message.
message CleanRetainPublishMessageResponse {}

// Session version information.
message SessionVersion {
    uint64 counter = 1; // Version counter
    uint64 node_id = 2; // Node identifier
}

// Request to register a session actor mapping.
message RegisterSessionActorMapRequest {
    string tenant_id = 1;
    string client_id = 2;
    uint64 node_id = 3;
    SessionVersion session_version = 4;
}

// Response for registering a session actor mapping.
message RegisterSessionActorMapResponse {}

// Request to unregister a session actor mapping.
message UnregisterSessionActorMapRequest {
    string tenant_id = 1;
    string client_id = 2;
    SessionVersion session_version = 3;
}

// Response for unregistering a session actor mapping.
message UnregisterSessionActorMapResponse {}

// Request to renew a session lease.
message RenewSessionLeaseRequest {
    string tenant_id = 1;
    string client_id = 2;
}

// Response for renewing a session lease.
message RenewSessionLeaseResponse {}

// Request to get the session actor map for a client.
message GetSessionActorMapRequest {
    string tenant_id = 1; // Tenant identifier
    string client_id = 2; // Client identifier
}

// Response for getting the session actor map.
message GetSessionActorMapResponse {
    optional string payload = 1;
}

message RoutePacketRequest {
    string tenant_id = 1; // Tenant identifier
    string payload = 2; // MQTT packet to route
    string route_id = 3; // Durable route task id, empty for best-effort
    uint64 source_node_id = 4; // Source node identifier
    string target_client_id = 5; // Explicit target client id
    uint32 target_qos = 6; // Effective qos for the target subscriber
    uint64 expiry_at = 7; // Expiry timestamp in unix seconds
}

message RoutePacketResponse {}

message ForceStopSessionActorRequest {
    string tenant_id = 1; // Tenant identifier
    string client_id = 2; // Client identifier
}

message ForceStopSessionActorResponse {}

message GetSessionInfoRequest {
    string tenant_id = 1; // Tenant identifier
    string client_id = 2; // Client identifier
}

// Session activity state
enum ActivityState {
    ACTIVITY_STATE_UNSPECIFIED = 0;
    ACTIVITY_STATE_ACTIVE = 1;
    ACTIVITY_STATE_INACTIVE = 2;
    ACTIVITY_STATE_DISCONNECTED = 3;
}

message SessionInfo {

    string tenant_identifier = 1; // tenant identifier
    
    string client_identifier = 2; // client identifier
    
    repeated string subscription_topics = 3; // subscription topics
    
    ActivityState session_state = 4; // session activity state

    optional string ip_address = 5; // client ip address
    
    bool connected = 6; // is client connected
    
    optional uint64 connected_at = 7; // latest client connected timestamp in milliseconds
    
    uint64 created_at = 8; // session created timestamp in milliseconds
    
    optional uint64 disconnected_at = 9; // latest client disconnected timestamp in milliseconds
    
    uint64 messages_received = 10; // total mqtt messages received
    
    uint64 messages_sent = 11; // total mqtt messages sent

}

message GetSessionInfoResponse {
    optional SessionInfo payload = 1; // Session metrics data
}
