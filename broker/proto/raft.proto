syntax = "proto3";

package openraftpb;

enum ErrorCode {
  UNKNOWN = 0;
  INTERNAL_ERROR = 1;
}

service RaftService {

  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);

  rpc Vote(VoteRequest) returns (VoteResponse);

  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);

  rpc RoutePacket(RoutePacketRequest) returns (RoutePacketResponse);

}

message ErrorDetail {

  ErrorCode code = 1;

  string message = 2;

  string node = 3;

}

message RoutePacketRequest {

  string data = 1;

}

message RoutePacketResponse {

  bool success = 1;

  ErrorDetail error = 2;

  string data = 3;

}

enum RaftType {
  TOPIC = 0;
  SESSION_ACTOR_MAP = 1;
}

message AppendEntriesRequest {
  string data = 1;
  RaftType raft_type = 2;
}

message AppendEntriesResponse {
  bool success = 1;

  ErrorDetail error = 2;

  string data = 3;
}

message VoteRequest {
  string data = 1;
  RaftType raft_type = 2;
}

message VoteResponse {
  bool success = 1;

  ErrorDetail error = 2;

  string data = 3;
}

message InstallSnapshotRequest {
  string data = 1;
  RaftType raft_type = 2;
}

message InstallSnapshotResponse {
  bool success = 1;

  ErrorDetail error = 2;

  string data = 3;
}