[package]
name = "yedmq"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
nom = "7.1.3"
byteorder = "1.4.3"
bytes = "1"
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1.29.1", features = ["full"] }
tokio-util = { version = "0.7.10", features = ["io","time"] }
tokio-rustls = "0.26.4"
tokio-test = "0.4.3"
log = "0.4"
rand = "0.8"
serde = { version = "1.0.114", features = ["derive", "rc"] }
serde_json = "1.0.57"
config = "0.13.1"
toml = "0.8.6"
env_logger = "0.10.1"
tokio-tungstenite = { version = "0.24.0", features = ["native-tls"] }
futures = "0.3"
prost-types = "0.13.4"
yedmq-mqtt = { version = "0.1.0", path = "../mqtt" }
yedmq-plugin-host = { version = "0.1.0", path = "../plugin_host" }
libloading = "0.8.5"
axum = "0.7.9"
base64 = "0.22.1"
openraft = { version = "0.9.20", features = ["serde", "storage-v2"] }
rocksdb = "0.22.0"
prost = "0.13.4"
tonic = "0.12.3"
tonic-build = "0.12.3"
uuid = { version = "1.14.0", features = ["v4", "fast-rng", "macro-diagnostics"] }
portpicker = "0.1.1"
actix = "0.13.5"
async-trait = "0.1.87"
backoff = "0.4"
mockall = "0.13.1"
rustls = { version = "0.23.27", default-features = false, features = ["std"] }
reqwest = { version = "0.12", features = ["json"] }
num_cpus = "1.17.0"
governor = "0.10.4"
dashmap = "=6.1.0"
parking_lot = { version = "0.12.5", features = ["serde"] }
tokio-stream = { version = "0.1.17", features = ["net", "sync"] }

[dev-dependencies]
rumqttc = { version = "0.24.0", default-features = false, features = ["use-rustls", "websocket"] }
tempfile = "3.21.0"
rustls-pemfile = "2.1.0"

[build-dependencies]
prost-build = "0.13.4"
tonic-build = "0.12.3"
