[package]
name = "mock_plugin_harness"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.29.1", features = ["full"] }
tokio-util = { version = "0.7.16", features = ["codec", "compat"] }
interprocess = { version = "2.2.3", features = ["tokio", "async"] }
log = "0.4"
env_logger = "0.10.1"
yedmq-plugin-host = { version = "0.1.0", path = "../plugin_host" }
serde = { version = "1.0.114", features = ["derive"] }
serde_json = "1.0.57"
clap = { version = "4.5.48", features = ["derive"] }
prost = "0.13.4"
bytes = "1"
prost-types = "0.13.4"
anyhow = "1.0"
futures = "0.3.31"