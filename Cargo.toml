[package]
name = "samoye"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
nom = "7.1.3"
byteorder = "1.4.3"
bytes = "1"
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1.29.1", features = ["full"] }
tokio-test = "0.4.3"
mlua = { version = "0.8.9", features = ["lua54", "vendored", "macros"]}
log = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
config = "0.13.1"
toml = "0.8.6"