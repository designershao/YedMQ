[package]
name = "yedmq-plugins-acl-redis"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
yedmq-plugin = { path = "../../plugin" }
yedmq-mqtt = { path = "../../mqtt" }
anyhow = "1.0"
log = "0.4"
env_logger = "0.10.1"
redis = { version = "0.27.6", features = ["r2d2"] }
r2d2 = "0.8.10"
toml = "0.8.6"
serde = { version = "1.0", features = ["derive"] }